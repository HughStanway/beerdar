<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Retro Hard Drop Shadow -->
  <rect x="8" y="8" width="52" height="52" fill="#000000" />
  
  <!-- Outer Border & Retro Amber Background -->
  <rect x="4" y="4" width="52" height="52" fill="#facc15" stroke="#000000" stroke-width="4" />
  
  <!-- Beer Mug Handle -->
  <path d="M42 25 h 6 v 14 h -6" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="square" />
  
  <!-- Glass Body -->
  <rect x="18" y="24" width="24" height="22" fill="#fbbf24" stroke="#000000" stroke-width="4" />
  
  <!-- Glass Shading / Liquid Detail -->
  <rect x="22" y="30" width="4" height="12" fill="#d97706" />
  <rect x="28" y="30" width="4" height="12" fill="#d97706" />
  
  <!-- Foam Top (Froth) -->
  <path d="M16 18 h 28 v 8 h -28 z" fill="#ffffff" stroke="#000000" stroke-width="4" />
  <circle cx="20" cy="18" r="4" fill="#ffffff" stroke="#000000" stroke-width="3" />
  <circle cx="28" cy="16" r="5" fill="#ffffff" stroke="#000000" stroke-width="3" />
  <circle cx="36" cy="16" r="5" fill="#ffffff" stroke="#000000" stroke-width="3" />
  <circle cx="44" cy="18" r="4" fill="#ffffff" stroke="#000000" stroke-width="3" />
  
  <!-- Beer Bubbles -->
  <circle cx="25" cy="34" r="1.5" fill="#ffffff" />
  <circle cx="33" cy="38" r="1.5" fill="#ffffff" />
</svg>